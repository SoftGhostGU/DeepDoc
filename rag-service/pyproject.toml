[project]
name = "rag-service"
version = "0.1.0"
description = "DeepDoc RAG Service - 面向长文档的层级 RAG 系统"
readme = {text = "", content-type = "text/plain"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.20",
    "pypdf>=5.0.0",
    "openai>=1.50.0",
    "loguru>=0.7.2",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "aiosqlite>=0.20.0",
    "pymupdf>=1.27.2.2",
    "sentence-transformers>=5.4.0",
    "torch>=2.11.0",
    "rank-bm25>=0.2.2",
    "qdrant-client>=1.12.0",
    "jieba>=0.42.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "A", "PIE", "T20", "FIX", "ANN", "ASYNC", "PERF", "PTH"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
