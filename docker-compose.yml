services:
  web:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    container_name: deepdoc-web
    environment:
      NODE_ENV: development
      RAG_SERVICE_URL: http://rag:8000
      DATABASE_URL: file:/app/dev.db
    ports:
      - "3000:3000"
    volumes:
      - ./web-app:/app
      - web-node-modules:/app/node_modules
      - web-pnpm-store:/pnpm/store
    depends_on:
      - rag
      - qdrant
    command: sh -c "pnpm install && pnpm dev --hostname 0.0.0.0 --port 3000"

  rag:
    image: python:3.11-slim
    container_name: deepdoc-rag
    working_dir: /app
    environment:
      PYTHONUNBUFFERED: "1"
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - ./rag-service:/app
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn python-multipart &&
      uvicorn app.api.routes:app --host 0.0.0.0 --port 8000"
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.15.1
    container_name: deepdoc-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage

volumes:
  web-node-modules:
  web-pnpm-store:
  qdrant-storage:
