services:
  web:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    container_name: deepdoc-web
    environment:
      NODE_ENV: development
      CI: "true"
      RAG_SERVICE_URL: ${RAG_SERVICE_URL:-}
      DATABASE_URL: file:/app/dev.db
    ports:
      - "3000:3000"
    volumes:
      - ./web-app:/app
      - web-node-modules:/app/node_modules
      - web-pnpm-store:/pnpm/store
    command: sh -c "pnpm install && npx prisma generate && npx prisma db push && pnpm dev --hostname 0.0.0.0 --port 3000"

  rag:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    container_name: deepdoc-rag
    profiles: ["full"]
    environment:
      PYTHONUNBUFFERED: "1"
      QDRANT_URL: http://qdrant:6333
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.minimax.chat/v1}
      LLM_MODEL: ${LLM_MODEL:-MiniMax-Text-01}
    ports:
      - "8000:8000"
    volumes:
      - ./rag-service:/app
      - rag-data:/app/data
    command: >
      sh -c "pip install --no-cache-dir uv &&
      uv sync &&
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.15.1
    container_name: deepdoc-qdrant
    profiles: ["full"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage

volumes:
  web-node-modules:
  web-pnpm-store:
  qdrant-storage:
  rag-data:
